version: '3.8'

services:
  latex:
    build: ./latex-service
    ports:
      - "8000:8000"

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8000"
    depends_on:
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-worker:
    build: ./ai-service
    command: celery -A celery_app:celery_app worker --loglevel=info
    depends_on:
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"